name: geges_smartbarber
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+5

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  http: ^1.5.0

  # versi FlutterFire yang stabil & kompatibel dengan Flutter 3.9
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0

  path: ^1.8.3
  provider: ^6.1.2
  intl: ^0.20.2

  # plugin Google Sign-In yang stabil
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^8.0.0

  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  url_launcher: ^6.1.7
  file_picker: ^10.3.8
  flutter_launcher_icons: ^0.14.4
  geolocator: ^13.0.0
  geocoding: ^4.0.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.1+2
  flutter_native_splash: ^2.4.0
  firebase_app_check: ^0.3.1+1
  sentry_flutter: ^9.9.2
  http_parser: ^4.1.2
  dio: ^5.9.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  plugin_platform_interface: ^2.1.8
  # Use a lightweight in-memory Firestore for unit tests to avoid fragile typed mocks
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  network_image_mock: ^2.1.1

flutter_native_splash:
  color: "#000000"
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#000000"
    icon_background_color: "#000000"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ivon.png"
  min_sdk_android: 21
