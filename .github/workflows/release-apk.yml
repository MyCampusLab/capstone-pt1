name: Release APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Customer APK
        run: flutter build apk --debug --flavor customer -t lib/main_customer.dart

      - name: Build Partner APK
        run: flutter build apk --debug --flavor partner -t lib/main_partner.dart

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: |
            build/app/outputs/flutter-apk/app-customer-debug.apk
            build/app/outputs/flutter-apk/app-partner-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartBarber APK Release
          body: Release for USB-connected Android phone testing
          files: |
            build/app/outputs/flutter-apk/app-customer-debug.apk
            build/app/outputs/flutter-apk/app-partner-debug.apk