name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  backend-checks:
    name: Backend Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: backend
        run: bun install

      - name: TypeScript Static Analysis
        working-directory: backend
        run: bun x tsc --noEmit

      - name: Run Algorithmic & Concurrency Tests
        working-directory: backend
        env:
          CI: true
        run: bun test

  flutter-checks:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Stable Unit & Widget Tests
        run: flutter test test/unit/emvco_qris_helper_test.dart test/widget/auth/login_register_ui_test.dart test/widget/payment/payment_screen_widget_test.dart test/widget/payment_screen_blocking_v2_test.dart test/widget/payment/payment_screen_tenant_snackbar_test.dart